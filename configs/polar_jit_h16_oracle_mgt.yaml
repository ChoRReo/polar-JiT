model:
  image_size: 256
  patch_size: 16
  target_channels: 6
  # S0 RGB + theta/pi + cos(2phi) + sin(2phi) + scalar m_gt from raw GT.
  condition_channels: 7
  hidden_size: 1280
  depth: 32
  num_heads: 16
  mlp_ratio: 4.0
  bottleneck_dim: 256
  in_context_len: 32
  in_context_start: 10
  refiner_hidden_channels: 64
  attn_dropout: 0.0
  proj_dropout: 0.0

pretrained:
  enabled: false

flow:
  p_mean: -0.8
  p_std: 0.8
  noise_scale: 1.0
  t_eps: 0.05

data:
  format: unified_sfp
  root: ../datasets/UnifiedSfP_png
  sources: [deepsfp, sfpuel, transsfp]
  split: train
  image_size: 256
  augment: true
  oracle_mgt_condition: true

train:
  batch_size: 8
  num_workers: 4
  max_steps: 300000
  learning_rate: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  ema_decay: 0.9999
  amp_dtype: bfloat16
  w_flow: 1.0
  w_clean_l1: 0.1
  w_gradient_l1: 0.1
  w_high_frequency_l1: 0.1
  w_dolp_l1: 0.1
  w_aop_l1: 0.1
  high_frequency_kernel_sizes: [3, 7]
  gradient_patch_boundary_weight: 4.0
  log_every: 200
  log_file: train_log.jsonl
  save_every: 50000
  output_dir: checkpoints/polar_jit_h16_oracle_mgt
  seed: 42

inference:
  split: test
  condition_key: condition
  output_dir: outputs/polar_jit_h16_oracle_mgt
  steps: 20
  method: heun
  max_samples: 0
  seed: 42
  device: cuda

evaluation:
  split: test
  gt_dir: test_gt
  predictions: outputs/polar_jit_h16_oracle_mgt
  output_csv: outputs/metrics/polar_jit_h16_oracle_mgt.csv
  max_samples: 0
  fail_on_missing: false
  ssim_window_size: 11
  ssim_sigma: 1.5
  mask_threshold: 0.5
  visualize: true
  visualization_dir: outputs/visualizations/polar_jit_h16_oracle_mgt
  max_visualizations: 0
