[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-jit-flow"
version = "0.1.0"
description = "S0-conditioned JiT flow matching for polarization recovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pillow>=10",
  "pyyaml>=6",
  "scipy>=1.10",
  "torch>=2.2",
  "safetensors>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"
