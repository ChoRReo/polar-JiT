model:
  image_size: 256
  patch_size: 8
  hidden_size: 512
  depth: 12
  num_heads: 8
  mlp_ratio: 4.0
  bottleneck_dim: 64
  free_channels: 4
  anchor_width: 64
  dropout: 0.0
flow:
  p_mean: -0.8
  p_std: 0.8
  noise_scale: 1.0
  t_eps: 0.05
data:
  format: unified_sfp
  root: /home/xserver/pjt/datasets/UnifiedSfP_png
  sources:
  - deepsfp
  - sfpuel
  - transsfp
  split: train
  image_size: 256
  augment: true
train:
  batch_size: 8
  num_workers: 4
  max_steps: 100000
  learning_rate: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  ema_decay: 0.9999
  amp_dtype: bfloat16
  w_flow: 1.0
  w_theta: 0.1
  w_phi: 0.1
  w_clean_l1: 0.1
  w_dolp: 0.1
  w_aop: 0.1
  object_weight: 10.0
  background_weight: 0.01
  log_every: 20
  save_every: 5000
  output_dir: checkpoints/experiments/model_scaling/small
  seed: 42
evaluation:
  split: test
  ssim_window_size: 11
  ssim_sigma: 1.5
  mask_threshold: 0.5
